
# netlify.toml — autoremediation.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/auto-remediation.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation"
  status = 301
  force = true

[[redirects]]
  from = "/introduction/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/introduction"
  status = 301
  force = true

[[redirects]]
  from = "/use_cases/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/use-cases"
  status = 301
  force = true

[[redirects]]
  from = "/ir_workflows/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/automating-response"
  status = 301
  force = true

[[redirects]]
  from = "/automation_ir/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/automation-for-resolution"
  status = 301
  force = true

[[redirects]]
  from = "/getting_started/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/getting-started"
  status = 301
  force = true

[[redirects]]
  from = "/regulated_envs/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/regulated-environments"
  status = 301
  force = true

[[redirects]]
  from = "/challenges/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/challenges"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation/additional-resources"
  status = 301
  force = true

# Catch-all: assets, sitemap.xml, search index, unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/auto-remediation"
  status = 301
  force = true
